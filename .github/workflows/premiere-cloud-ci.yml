name: Premiere Cloud - testes auxiliares (nao executa Premiere)
on:
  push:
    paths: ['premiere-cloud/**', '.github/workflows/premiere-cloud-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auxiliary-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Testar contrato, seguranca, audio e FFprobe
        run: python -m unittest discover -s premiere-cloud/tests -v
  powershell-parser:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe PowerShell sem instalar Adobe
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem premiere-cloud/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; $failed = $true }
          }
          if ($failed) { throw 'Sintaxe PowerShell invalida' }
