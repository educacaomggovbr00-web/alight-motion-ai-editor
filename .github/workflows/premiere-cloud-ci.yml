name: Premiere Cloud - testes auxiliares (nao executa Premiere)
on:
  push:
    paths: ['premiere-cloud/**', '.github/workflows/premiere-cloud-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auxiliary-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg qemu-utils
      - name: Testar contrato, seguranca, audio e FFprobe
        run: python -m unittest discover -s premiere-cloud/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar contrato UXP sem simular prova de Premiere instalado
        run: |
          node --check premiere-cloud/automation/uxp-panel/index.js
          node --test premiere-cloud/tests/uxp-adapter.test.js
      - name: Disponibilizar somente codigo do painel (sem instaladores Adobe)
        uses: actions/upload-artifact@v4
        with:
          name: premiere-uxp-panel-source
          path: premiere-cloud/automation/uxp-panel/
          retention-days: 7
          if-no-files-found: error
  powershell-parser:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe PowerShell sem instalar Adobe
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem premiere-cloud/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; $failed = $true }
          }
          if ($failed) { throw 'Sintaxe PowerShell invalida' }
      - name: Criar dispositivo WARP real (Windows Server, nao Windows 11)
        shell: pwsh
        run: ./premiere-cloud/windows/test-warp.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: warp-device-diagnostic
          path: premiere-cloud/runtime/warp.json
          retention-days: 7
          if-no-files-found: error
