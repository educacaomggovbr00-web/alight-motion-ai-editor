name: DaVinci Resolve — diagnostico, nao renderiza
on:
  workflow_dispatch:
  push:
    paths: ['davinci-resolve/**', '.github/workflows/diagnosticar-davinci.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar validacao sem instalar Resolve
        run: python3 -m unittest discover -s davinci-resolve/tests -v
      - name: Testar fallback Lua sem abrir nem baixar Resolve
        run: python3 -m unittest discover -s davinci-resolve/experiments/dvip -p test_safety.py -v
      - name: Verificar sintaxe Lua 5.1 sem iniciar Resolve
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1
          luac5.1 -p davinci-resolve/experiments/dvip/lua_probe.lua
          luac5.1 -p davinci-resolve/experiments/dvip/lua_edit_smoke.lua
          lua5.1 davinci-resolve/experiments/dvip/test_lua_smoke.lua
      - name: Inspecionar recursos reais do runner
        run: python3 davinci-resolve/preflight.py --output davinci-resolve/runtime/host.json
      - uses: actions/upload-artifact@v4
        with:
          name: davinci-host-diagnostic
          path: davinci-resolve/runtime/host.json
          retention-days: 7
          if-no-files-found: error
      - run: echo 'Diagnostico produzido. Leia state/blockers do JSON; nao houve instalacao, abertura ou exportacao pelo Resolve.' >> "$GITHUB_STEP_SUMMARY"
