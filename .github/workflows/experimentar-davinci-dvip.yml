name: DaVinci 21.1.1 — experimento DVIP isolado
on:
  workflow_call:
    inputs:
      private_media:
        type: boolean
        default: false
      lua_native_edit:
        type: boolean
        default: false
    secrets:
      DAVINCI_RESOLVE_LINUX_URL:
        required: false
      DAVINCI_INPUT_VIDEO_URL:
        required: false
      DAVINCI_MEDIA_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar gates, privacidade, timeout e interfaces oficiais sem iniciar Resolve
        run: |
          set -euo pipefail
          mkdir -p dvip-preflight
          python3 -m unittest discover -s davinci-resolve/experiments/dvip -p test_safety.py -v 2>&1 | tee dvip-preflight/unit-tests.log
        shell: bash
      - name: Verificar somente disponibilidade e validade da entrada privada
        id: source
        env:
          DAVINCI_RESOLVE_LINUX_URL: ${{ secrets.DAVINCI_RESOLVE_LINUX_URL }}
        run: |
          if python3 davinci-resolve/experiments/dvip/source.py availability --private-dir "$RUNNER_TEMP/davinci-private" --report dvip-preflight/source.json; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Conferir somente configuração privada quando solicitada
        if: inputs.private_media
        env:
          DAVINCI_INPUT_VIDEO_URL: ${{ secrets.DAVINCI_INPUT_VIDEO_URL }}
          DAVINCI_MEDIA_PASSWORD: ${{ secrets.DAVINCI_MEDIA_PASSWORD }}
        run: python3 davinci-resolve/experiments/dvip/private_input.py availability --private-dir "$RUNNER_TEMP/davinci-user"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: davinci-dvip-preflight
          path: dvip-preflight/
          retention-days: 7
          if-no-files-found: error
  original:
    needs: preflight
    if: needs.preflight.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar recursos e dispositivo oficial de memória
        shell: bash
        run: |
          mkdir -p dvip-output
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          p=shutil.disk_usage('.')
          Path('dvip-output/host.json').write_text(json.dumps({'freeDiskBytes':p.free,'physicalRenderNodes':[str(x) for x in Path('/dev/dri').glob('renderD*')],'state':'experimental','gpuHardwareCreated':False},indent=2))
          if p.free < 18*1024**3: raise SystemExit('Bloqueado: menos de 18 GiB livres para instalador/extracao/driver isolados.')
          PY
          if [[ ! -e /dev/udmabuf && ! -r /sys/class/misc/udmabuf/dev ]]; then
            sudo modprobe udmabuf || true
          fi
          if [[ ! -e /dev/udmabuf && -r /sys/class/misc/udmabuf/dev ]]; then
            IFS=: read -r major minor < /sys/class/misc/udmabuf/dev
            sudo mknod -m 600 /dev/udmabuf c "$major" "$minor"
          fi
          test -e /dev/udmabuf || { echo 'Bloqueado: udmabuf indisponível neste kernel.'; exit 2; }
          uname -r > dvip-output/kernel.txt
      - name: Restaurar Mesa e dependências livres em uma única imagem
        timeout-minutes: 35
        uses: ./.github/actions/resolve-deps-cache
      - name: Atualizar runtime e scripts sem recompilar Mesa
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain -f davinci-resolve/experiments/dvip/runtime.Dockerfile \
            -t codex-resolve-dvip davinci-resolve/experiments 2>&1 | tee dvip-output/runtime-build.log
          docker run --rm codex-resolve-dvip cat /experiment/runtime-package-versions.txt > dvip-output/package-versions.txt
          docker run --rm codex-resolve-dvip cat /experiment/mesa-library-hashes.txt > dvip-output/mesa-library-hashes.txt
          docker run --rm codex-resolve-dvip cat /build/patch-result.json > dvip-output/mesa-patch.json
          docker inspect --format '{{.Id}}' codex-resolve-dvip > dvip-output/container-id.txt
      - name: Revalidar quatro buffers com a mesma imagem antes de baixar o original
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dvip-output/gate
          probe_name="mesa-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$probe_name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 240s docker run --rm --name "$probe_name" --memory=6g --cpus=2 \
            --device /dev/udmabuf -e CODEX_EXPERIMENTAL_SOFTWARE_GL_SHARING=1 \
            -v "$PWD/dvip-output/gate:/output" codex-resolve-dvip \
            python3 /experiment/run-gl-sharing-matrix.py --output /output --label with-udmabuf
          python3 - <<'PYCODE'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'davinci-resolve/experiments/dvip')
          from supervise import verified
          probes=[json.loads(p.read_text()) for p in Path('dvip-output/gate').glob('*-glx.json')]
          probes += [json.loads(p.read_text()) for p in Path('dvip-output/gate').glob('*-egl.json')]
          if len(probes)!=4 or not all(verified(p) for p in probes):
              raise SystemExit('Gate bloqueado: quatro buffers não passaram. Download do Resolve não iniciado.')
          PYCODE
      - name: Baixar entrada privada e calcular chave opaca para cache cifrado
        if: inputs.private_media
        id: private-key
        timeout-minutes: 4
        env:
          DAVINCI_INPUT_VIDEO_URL: ${{ secrets.DAVINCI_INPUT_VIDEO_URL }}
          DAVINCI_MEDIA_PASSWORD: ${{ secrets.DAVINCI_MEDIA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 davinci-resolve/experiments/dvip/private_input.py download --private-dir "$RUNNER_TEMP/davinci-user"
          recipe="45:15:540:960:30:dnxhr_lb:pcm48k:$(sha256sum davinci-resolve/experiments/dvip/prepare_private_input.py | cut -d' ' -f1)"
          key=$(docker run --rm --user "$(id -u):$(id -g)" --memory=1g --ulimit core=0 \
            -e DAVINCI_MEDIA_PASSWORD -v "$RUNNER_TEMP/davinci-user:/private" \
            -v "$PWD/davinci-resolve/experiments/dvip:/scripts:ro" codex-resolve-deps \
            python3 /scripts/private_crypto.py cache-key --input /private/input-original.mp4 --recipe "$recipe")
          [[ "$key" =~ ^dvr-input-private-v1-[a-f0-9]{64}$ ]] || { echo 'Chave de cache privado inválida.'; exit 2; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restaurar somente entrada já cifrada (nenhum vídeo em claro no cache)
        if: inputs.private_media
        id: private-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/davinci-input-cache
          key: ${{ steps.private-key.outputs.key }}
      - name: Preparar ou abrir entrada privada autenticada
        if: inputs.private_media
        env:
          DAVINCI_MEDIA_PASSWORD: ${{ secrets.DAVINCI_MEDIA_PASSWORD }}
          INPUT_CACHE_HIT: ${{ steps.private-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/davinci-input-cache"
          if [[ "$INPUT_CACHE_HIT" == true ]]; then
            docker run --rm --user "$(id -u):$(id -g)" --memory=1g --ulimit core=0 \
              -e DAVINCI_MEDIA_PASSWORD -v "$RUNNER_TEMP/davinci-user:/private" \
              -v "$RUNNER_TEMP/davinci-input-cache:/encrypted:ro" \
              -v "$PWD/davinci-resolve/experiments/dvip:/scripts:ro" codex-resolve-deps \
              python3 /scripts/private_crypto.py decrypt --kind input --input /encrypted/prepared.dvi --output /private/prepared/input-prepared.mov
          else
            docker run --rm --user "$(id -u):$(id -g)" --memory=1g --cpus=2 --ulimit core=0 \
              -v "$RUNNER_TEMP/davinci-user:/private" \
              -v "$PWD/davinci-resolve/experiments/dvip:/scripts:ro" codex-resolve-deps \
              python3 /scripts/prepare_private_input.py --input /private/input-original.mp4 --private-dir /private/prepared --start 45 --duration 15
            docker run --rm --user "$(id -u):$(id -g)" --memory=1g --ulimit core=0 \
              -e DAVINCI_MEDIA_PASSWORD -v "$RUNNER_TEMP/davinci-user:/private:ro" \
              -v "$RUNNER_TEMP/davinci-input-cache:/encrypted" \
              -v "$PWD/davinci-resolve/experiments/dvip:/scripts:ro" codex-resolve-deps \
              python3 /scripts/private_crypto.py encrypt --kind input --input /private/prepared/input-prepared.mov --output /encrypted/prepared.dvi
          fi
      - name: Salvar somente entrada cifrada, antes da tentativa do Resolve
        if: inputs.private_media && steps.private-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/davinci-input-cache
          key: ${{ steps.private-key.outputs.key }}
      - name: Obter somente o instalador oficial privado e conferir SHA-256 conhecido
        timeout-minutes: 12
        env:
          DAVINCI_RESOLVE_LINUX_URL: ${{ secrets.DAVINCI_RESOLVE_LINUX_URL }}
        run: python3 davinci-resolve/experiments/dvip/source.py download --private-dir "$RUNNER_TEMP/davinci-private" --report dvip-output/source-integrity.json
      - name: Extrair o original sem modificar seus arquivos nem executar instalacao silenciosa
        timeout-minutes: 5
        run: |
          docker run --rm --memory=6g --cpus=2 --ulimit core=0 \
            -v "$RUNNER_TEMP/davinci-private:/private" -v "$PWD/dvip-output:/output" \
            codex-resolve-dvip python3 /experiment/dvip/source.py extract --private-dir /private --report /output/extraction.json
      - name: Gate GL/CL e execucao limitada e script interno do Resolve original em GLX
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          probe_name="davinci-original-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$probe_name" >/dev/null 2>&1 || true' EXIT
          extra=()
          native_args=()
          if [[ '${{ inputs.lua_native_edit }}' == true ]]; then
            native_args+=(--lua-native-edit)
          fi
          if [[ '${{ inputs.private_media }}' == true ]]; then
            extra=(-v "$RUNNER_TEMP/davinci-user/prepared:/input:ro")
            native_args+=(--input-video /input/input-prepared.mov --width 540 --height 960 --duration 15)
            if [[ '${{ inputs.lua_native_edit }}' == true ]]; then
              native_args+=(--allow-private-lua-edit)
            fi
          fi
          for profile in glx; do
            mkdir -p "dvip-output/$profile"
            set +e
            timeout --kill-after=5s 960s docker run --rm --name "$probe_name" --memory=6g --cpus=2 --ulimit core=0 --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
              --device /dev/udmabuf "${extra[@]}" \
              -v "$RUNNER_TEMP/davinci-private/squashfs-root:/opt/resolve" \
              -v "$RUNNER_TEMP/davinci-private/squashfs-root/bin:/opt/resolve/bin:ro" \
              -v "$RUNNER_TEMP/davinci-private/squashfs-root/libs:/opt/resolve/libs:ro" \
              -v "$PWD/dvip-output/$profile:/output" \
              codex-resolve-dvip python3 /experiment/dvip/supervise.py \
              --resolve-root /opt/resolve --output /output --backend "$profile" \
              "${native_args[@]}"
            code=$?
            set -e
            printf '%s\n' "$code" > "dvip-output/$profile/container-exit-code.txt"
            docker rm -f "$probe_name" >/dev/null 2>&1 || true
          done
      - name: Proteger resultado pessoal antes de qualquer publicação
        if: always() && inputs.private_media
        env:
          DAVINCI_MEDIA_PASSWORD: ${{ secrets.DAVINCI_MEDIA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-delivery"
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          p=Path('dvip-output/glx/result.json')
          report=json.loads(p.read_text()) if p.exists() else {}
          public={k:report.get(k,False) for k in ['nativeRenderProven','nativeMp4ExportProven','mp4DeliveryValidated']}
          public['plaintextPublished']=False
          public['mediaInputCachedInClear']=False
          Path(os.environ['RUNNER_TEMP'],'private-delivery','result-public.json').write_text(json.dumps(public,indent=2))
          PYREPORT
          if [[ -f dvip-output/glx/render/final-delivery.mp4 ]] && python3 -c 'import json; from pathlib import Path; r=json.loads(Path("dvip-output/glx/result.json").read_text()); raise SystemExit(0 if r.get("nativeRenderProven") and r.get("mp4DeliveryValidated") else 2)'; then
            docker run --rm --memory=1g --ulimit core=0 -e DAVINCI_MEDIA_PASSWORD \
              -v "$PWD/dvip-output/glx/render:/render:ro" -v "$RUNNER_TEMP/private-delivery:/encrypted" \
              -v "$PWD/davinci-resolve/experiments/dvip:/scripts:ro" codex-resolve-deps \
              python3 /scripts/private_crypto.py encrypt --kind delivery --input /render/final-delivery.mp4 --output /encrypted/final.dvr
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/private-delivery"
          fi
      - name: Limpar somente arquivos proprietarios temporarios deste experimento
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/davinci-private" "$RUNNER_TEMP/davinci-user" "$RUNNER_TEMP/davinci-input-cache"
      - name: Remover arquivos de mídia pessoal em claro após proteger a entrega
        if: always() && inputs.private_media
        run: sudo rm -rf -- "$PWD/dvip-output/glx"
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.private_media
        with:
          name: davinci-original-dvip-evidence
          path: |
            dvip-output/*.json
            dvip-output/*.txt
            dvip-output/*build.log
            dvip-output/gate/*.json
            dvip-output/gate/*.log
            dvip-output/glx/*.json
            dvip-output/glx/*.log
            dvip-output/glx/*.png
            dvip-output/glx/*.txt
            dvip-output/glx/render/*.json
            dvip-output/glx/render/*.mp4
            dvip-output/glx/render/*.mov
            dvip-output/egl/*.json
            dvip-output/egl/*.log
            dvip-output/egl/*.png
            dvip-output/egl/*.txt
            dvip-output/egl/render/*.json
            dvip-output/egl/render/*.mp4
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.private_media
        with:
          name: meu-edit-davinci-protegido
          path: |
            ${{ runner.temp }}/private-delivery/final.dvr
            ${{ runner.temp }}/private-delivery/result-public.json
            davinci-resolve/experiments/dvip/mobile/decrypt.html
          retention-days: 7
          if-no-files-found: error
      - name: Exigir render nativo real e MP4 final validado; origem da embalagem explícita
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          paths=list(Path('dvip-output').glob('*/result.json'))
          private=Path(os.environ['RUNNER_TEMP'],'private-delivery','result-public.json')
          if private.exists():paths.append(private)
          reports=[json.loads(p.read_text()) for p in paths]
          passed=any(r.get('nativeRenderProven') is True and r.get('mp4DeliveryValidated') is True for r in reports)
          msg='Render nativo e MP4 final validados: '+str(passed)+'. MP4 direto pelo Resolve e conversão auxiliar após MOV têm estados separados no relatório.'
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(msg+'\n')
          raise SystemExit(0 if passed else 2)
          PY
  source-block:
    needs: preflight
    if: needs.preflight.outputs.source != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Informar o bloqueio sem executar downloads ou compilações inúteis
        run: |
          echo 'Bloqueado: segredo DAVINCI_RESOLVE_LINUX_URL ausente ou inválido/expirado.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configure uma nova URL oficial 21.1.1 Linux exclusivamente em Settings > Secrets and variables > Actions. Não cole o link nos arquivos, issues ou logs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Resolve, DVIP e exportação não iniciados nesta execução.' >> "$GITHUB_STEP_SUMMARY"
          exit 2
