# Experimental branch only. main retains its previously verified workflow.
name: DaVinci — DVIP original 21.1.1 por CPU (experimental)
on:
  workflow_dispatch:
  push:
    branches: ['experiment/davinci-21-1-1-software-dvip']
    paths:
      - '.github/workflows/testar-mesa-software-sharing.yml'
      - '.github/workflows/experimentar-davinci-dvip.yml'
      - 'davinci-resolve/experiments/dvip/*.py'
      - 'davinci-resolve/experiments/dvip/*Dockerfile'
concurrency:
  group: davinci-original-dvip-experimental
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  experiment:
    uses: ./.github/workflows/experimentar-davinci-dvip.yml
    secrets: inherit
