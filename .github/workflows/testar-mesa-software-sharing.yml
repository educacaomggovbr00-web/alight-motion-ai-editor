# Experimental branch only. main retains its previously verified workflow.
name: DaVinci — DVIP original 21.1.1 por CPU (experimental)
on:
  workflow_dispatch:
    inputs:
      private_media:
        description: 'Usar vídeo privado dos segredos (45–60 s; saída protegida por senha)'
        type: boolean
        default: false
      lua_native_edit:
        description: 'Teste Lua nativo, inclusive vídeo privado cifrado (experimental)'
        type: boolean
        default: false
      cache_installer_only:
        description: 'Somente baixar, verificar e guardar instalador oficial cifrado, sem Mesa/DaVinci'
        type: boolean
        default: false
      installer_url_once:
        description: 'URL temporária oficial (NÃO SECRETA, pode aparecer nos logs)'
        type: string
        required: false
      accept_public_url:
        description: 'Entendo que minha URL temporária pode ser visível no GitHub'
        type: boolean
        default: false
concurrency:
  group: davinci-original-dvip-experimental
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  experiment:
    if: github.event_name == 'workflow_dispatch' && !inputs.cache_installer_only && (inputs.installer_url_once == '' || inputs.accept_public_url)
    uses: ./.github/workflows/experimentar-davinci-dvip.yml
    with:
      private_media: ${{ github.event_name == 'workflow_dispatch' && inputs.private_media }}
      lua_native_edit: ${{ github.event_name == 'workflow_dispatch' && inputs.lua_native_edit }}
      installer_url_once: ${{ inputs.accept_public_url && inputs.installer_url_once || '' }}
    secrets: inherit

# Verificar abertura após limitar OCR da introdução; entrada sintética sem dados pessoais.

# Retentativa autorizada: coletar dependências Fusion e backtrace após No Scripts.

  installer-cache-only:
    if: github.event_name == 'workflow_dispatch' && inputs.cache_installer_only
    uses: ./.github/workflows/cache-installer-davinci.yml
    secrets: inherit
