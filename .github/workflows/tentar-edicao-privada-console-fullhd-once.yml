# Painel de controle manual do Resolve original. Não provisiona VM nem
# transforma runner GitHub em desktop persistente.
name: DaVinci original — editar vídeo com Console Full HD (uma tentativa)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Diagnóstico, tentativa sintética (público) / privada (privado), ou desktop próprio'
        type: choice
        required: true
        default: diagnostico
        options:
          - diagnostico
          - abrir-linux-persistente
          - abrir-windows-persistente
          - tentar-console-fullhd
      autorizar_tentativa:
        description: 'Autorizar uso de runner pesado (nao executa sem instalador/cache oficial)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/tentar-edicao-privada-console-fullhd-once.yml'

permissions:
  contents: read

concurrency:
  group: davinci-console-fullhd-manual
  cancel-in-progress: false

jobs:
  diagnostico:
    if: github.event_name == 'push' || inputs.modo == 'diagnostico'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: experiment/davinci-21-1-2-console-fullhd
      - name: Validar scripts oficiais 21.1.2 sem baixar instalador
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q davinci-resolve/experiments/dvip
          python3 -m unittest discover -s davinci-resolve/experiments/dvip -p test_safety.py -v
      - name: Conferir configuracao sem instalar nem acessar segredos
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## DaVinci original: controle do GitHub Actions'
            echo ''
            echo '- GitHub-hosted Ubuntu e temporario; nenhum desktop foi mantido aberto.'
            echo '- O Console Full HD SINTETICO agora usa experiment/davinci-21-1-2-console-fullhd (Resolve 21.1.2).'
            echo '- A tentativa usa VIDEO SINTETICO se o repo for publico, sem baixar videos privados. Em repo privado o fluxo exige segredos e cifra.'
            echo '- O render requer autorizar_tentativa=true e um instalador/cached oficial válido; pode falhar sem GPU real.'
            echo '- Para abrir a interface, configure um runner self-hosted na sessao grafica de uma maquina ja ligada.'
            echo '- Os modos Linux/Windows nao instalam DaVinci, nao provisionam hardware, nao expõem VNC/RDP e nao fazem login.'
            echo '- Ao iniciar a interface, conecte-se ao seu desktop usando o acesso remoto privado previamente configurado.'
          } >> "$GITHUB_STEP_SUMMARY"

  confirmar:
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'tentar-console-fullhd' && inputs.autorizar_tentativa != true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Impedir tentativa involuntaria
        run: |
          echo 'Tentativa nativa NAO iniciada. Marque autorizar_tentativa para executar o experimento pesado.' >> "$GITHUB_STEP_SUMMARY"
          exit 2

  tentar-original-privado:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.modo == 'tentar-console-fullhd' && inputs.autorizar_tentativa == true
    uses: educacaomggovbr00-web/alight-motion-ai-editor/.github/workflows/experimentar-davinci-dvip.yml@experiment/davinci-21-1-1-software-dvip
    with:
      private_media: true
      lua_native_edit: true
      source_ref: experiment/davinci-21-1-1-software-dvip
    secrets: inherit

  tentar-original-sintetico:
    # Repositório público: não baixar vídeo pessoal, não receber segredos de mídia.
    # Em repositorio privado, a tentativa original preserva o fluxo cifrado.
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && inputs.modo == 'tentar-console-fullhd' && inputs.autorizar_tentativa == true
    uses: educacaomggovbr00-web/alight-motion-ai-editor/.github/workflows/experimentar-davinci-dvip.yml@experiment/davinci-21-1-2-console-fullhd
    with:
      private_media: false
      lua_native_edit: true
      source_ref: experiment/davinci-21-1-2-console-fullhd
    secrets:
      DAVINCI_RESOLVE_LINUX_URL: ${{ secrets.DAVINCI_RESOLVE_LINUX_URL }}
      DAVINCI_RESOLVE_2112_SHA256: ${{ secrets.DAVINCI_RESOLVE_2112_SHA256 }}

  desktop-publico-bloqueado:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && (inputs.modo == 'abrir-linux-persistente' || inputs.modo == 'abrir-windows-persistente')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Orientar sem conectar computador pessoal ao repositório público
        shell: bash
        run: |
          {
            echo '## Desktop remoto não iniciado'
            echo ''
            echo 'Este repositório é PUBLICO: não conecte um runner persistente com GPU, acesso ao desktop e arquivos pessoais aqui.'
            echo 'Use um repositório PRIVADO separado, um computador/VM que já exista e esteja ligado, e acesso remoto autenticado.'
            echo 'O GitHub Actions não cria nem mantém uma VM ou sessão de desktop depois do job.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Desktop remoto bloqueado neste repositório público por segurança.'
          exit 2

  abrir-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.modo == 'abrir-linux-persistente'
    runs-on: [self-hosted, Linux, X64, davinci-gpu]
    timeout-minutes: 6
    steps:
      - name: Verificar desktop Linux e abrir DaVinci ja instalado
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISPLAY:-}" ]] || ! command -v xset >/dev/null || ! xset q >/dev/null 2>&1; then
            echo '::error::Runner Linux precisa iniciar dentro da sessao grafica X11 ja autenticada; nao execute como servico headless.'
            exit 2
          fi
          if [[ ! -x /opt/resolve/bin/resolve ]]; then
            echo '::error::DaVinci original ausente em /opt/resolve/bin/resolve. Instale legitimamente na maquina antes.'
            exit 2
          fi
          if [[ ! -e /dev/dri/renderD128 ]] && ! command -v nvidia-smi >/dev/null; then
            echo '::error::Nenhum dispositivo de GPU aparente. Corrija driver/hardware no host; CPU Mesa nao equivale a GPU suportada.'
            exit 2
          fi
          if pgrep -x resolve >/dev/null; then
            echo 'Processo Resolve ja existente; nao iniciar duplicado.'
          else
            # O host e persistente; remove somente a marca de limpeza de processos
            # do runner. Isso nao liga a maquina nem garante que a GUI abra.
            (env -u RUNNER_TRACKING_ID nohup /opt/resolve/bin/resolve </dev/null >"$RUNNER_TEMP/resolve-launch.log" 2>&1 &)
            sleep 12
            if ! pgrep -x resolve >/dev/null; then
              echo '::error::Nao encontrei processo Resolve apos a abertura. Consulte logs privados do host.'
              exit 2
            fi
          fi
          {
            echo '## Linux persistente'
            echo 'Resolve detectado como processo; esta verificacao NAO comprova interface editavel, GPU aceita ou render.'
            echo 'Abra o desktop no seu cliente remoto privado. Nao foi criado endereco remoto publico.'
          } >> "$GITHUB_STEP_SUMMARY"

  abrir-windows:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.modo == 'abrir-windows-persistente'
    runs-on: [self-hosted, Windows, X64, davinci-gpu]
    timeout-minutes: 6
    steps:
      - name: Verificar desktop Windows e abrir DaVinci ja instalado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'C:\Program Files\Blackmagic Design\DaVinci Resolve\Resolve.exe'
          if (-not [Environment]::UserInteractive) {
            throw 'Execute o runner como aplicativo na sessao Windows interativa, nao como servico.'
          }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'DaVinci Resolve original nao encontrado. Instale na maquina antes.'
          }
          $gpu = Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue
          if (-not $gpu) { throw 'Nenhum adaptador grafico encontrado no Windows.' }
          $process = Get-Process -Name Resolve -ErrorAction SilentlyContinue
          if (-not $process) {
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            Start-Process -FilePath $exe -ErrorAction Stop | Out-Null
            Start-Sleep -Seconds 12
            $process = Get-Process -Name Resolve -ErrorAction SilentlyContinue
          }
          if (-not $process) { throw 'Nao foi possivel confirmar que o processo Resolve iniciou.' }
          @(
            '## Windows persistente'
            'Processo Resolve detectado; isso NAO comprova que a interface ou exportacao funcionam.'
            'Conecte-se ao desktop Windows pelo acesso remoto privado que voce ja configurou.'
            'Nenhum host, senha ou link de desktop foi publicado nos artifacts.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
